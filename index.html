<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tableau cuisine</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #101418;
    color: #f4f6f8;
    font-family: Helvetica, Arial, sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Colonne gauche : horloge, date et météo */
  #colonne-gauche {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 34%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* Colonne droite : planning sur 3 semaines */
  #colonne-droite {
    position: absolute;
    top: 0;
    bottom: 0;
    right: 0;
    width: 66%;
  }

  #colonne-gauche > div { padding: 1.5vw; }
  #horloge { font-size: 5.8vw; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  #date { font-size: 1.4vw; color: #8b98a3; margin-top: 0.4vw; text-transform: capitalize; }

  /* Bloc météo actuelle */
  #meteo { margin-top: 1.1vw; }
  #meteo-ligne-principale { display: table; }
  #meteo-icone {
    display: table-cell;
    vertical-align: middle;
    padding-right: 0.8vw;
  }
  #meteo-icone .icone-svg {
    width: 3.1vw;
    height: 3.1vw;
    display: block;
  }
  #meteo-temp {
    display: table-cell;
    vertical-align: middle;
    font-size: 2.9vw;
    font-weight: 300;
    line-height: 1.1;
  }
  #meteo-desc { font-size: 1.15vw; color: #8b98a3; margin-top: 0.25vw; }
  #meteo-details { font-size: 0.9vw; color: #8b98a3; margin-top: 0.2vw; }
  #erreur-meteo { font-size: 0.92vw; color: #e5533d; display: none; margin-top: 0.4vw; line-height: 1.35; }

  /* Section météo heure par heure (juste sous la météo actuelle, avant les 7 jours) */
  #meteo-horaire { margin-top: 0.85vw; }
  .titre-sous-bloc {
    font-size: 0.82vw;
    font-weight: 700;
    color: #8b98a3;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 0.35vw;
  }
  .heure-carte {
    display: table;
    width: 100%;
    table-layout: fixed;
    background: #181f26;
    padding: 0.24vw 0.65vw;
    border-radius: 0.45vw;
    font-size: 0.84vw;
    margin-bottom: 0.2vw;
  }
  .heure-libelle {
    display: table-cell;
    vertical-align: middle;
    width: 22%;
    font-weight: 600;
  }
  .heure-icone {
    display: table-cell;
    vertical-align: middle;
    text-align: center;
  }
  .heure-icone .icone-svg {
    width: 1.2vw;
    height: 1.2vw;
    display: inline-block;
    vertical-align: middle;
  }
  .heure-pluie {
    display: table-cell;
    vertical-align: middle;
    text-align: right;
    color: #6ea8fe;
    font-size: 0.78vw;
    padding-right: 0.45vw;
  }
  .heure-temp {
    display: table-cell;
    vertical-align: middle;
    text-align: right;
    font-weight: 600;
  }

  /* Prévisions sur 7 jours */
  #previsions-7j { margin-top: 0.9vw; }
  .jour-carte {
    display: table;
    width: 100%;
    table-layout: fixed;
    background: #181f26;
    padding: 0.34vw 0.65vw;
    border-radius: 0.5vw;
    font-size: 0.9vw;
    margin-bottom: 0.3vw;
  }
  .jour-nom {
    display: table-cell;
    vertical-align: middle;
    width: 26%;
    font-weight: 600;
    text-transform: capitalize;
  }
  .jour-icone {
    display: table-cell;
    vertical-align: middle;
    text-align: center;
  }
  .jour-icone .icone-svg {
    width: 1.4vw;
    height: 1.4vw;
    display: inline-block;
    vertical-align: middle;
  }
  .jour-pluie {
    display: table-cell;
    vertical-align: middle;
    text-align: right;
    color: #6ea8fe;
    font-size: 0.84vw;
    padding-right: 0.5vw;
  }
  .jour-temp {
    display: table-cell;
    vertical-align: middle;
    text-align: right;
    font-weight: 600;
  }
  .jour-temp span { color: #8b98a3; font-weight: 400; }

  /* Bloc planning 3 semaines x 7 jours */
  #pile {
    position: absolute;
    top: 1vw;
    right: 1.1vw;
    bottom: 1vw;
    left: 0.4vw;
  }
  .cal-bloc-unique {
    position: relative;
    width: 100%;
    height: 100%;
    background: #181f26;
    border-radius: 0.9vw;
    padding: 1vw 1.1vw;
  }
  .cal-entete {
    margin-bottom: 0.55vw;
    overflow: hidden;
  }
  .cal-titre-principal {
    float: left;
    font-size: 1.65vw;
    font-weight: 700;
  }
  .legende {
    float: right;
    font-size: 1.1vw;
    margin-top: 0.2vw;
  }
  .legende-item {
    display: inline-block;
    margin-left: 1.1vw;
    font-weight: 600;
  }
  .pastille {
    width: 0.85vw;
    height: 0.85vw;
    border-radius: 50%;
    display: inline-block;
    vertical-align: middle;
    margin-right: 0.35vw;
  }
  .pastille-capucine { background: #ff69b4; }
  .pastille-clemence { background: #ffd43b; }

  /* En-tête des jours de la semaine */
  .jours-semaine-entete {
    display: table;
    width: 100%;
    table-layout: fixed;
    margin-bottom: 0.3vw;
  }
  .jour-semaine-label {
    display: table-cell;
    text-align: center;
    font-size: 1.05vw;
    font-weight: 700;
    color: #8b98a3;
    text-transform: uppercase;
    padding: 0.15vw 0;
  }

  #statut-calendrier {
    max-height: 4.5vw;
    overflow-y: auto;
    margin-bottom: 0.25vw;
  }

  #zone-grille {
    position: relative;
    width: 100%;
    height: 83%;
  }

  #grille-4-semaines {
    display: table;
    width: 100%;
    height: 100%;
    table-layout: fixed;
    border-collapse: separate;
    border-spacing: 0.36vw;
  }
  .ligne-semaine {
    display: table-row;
  }
  .case-jour {
    display: table-cell;
    vertical-align: top;
    width: 14.2857%;
    background: #202933;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 0.5vw;
    padding: 0.32vw 0.4vw;
    overflow: hidden;
  }
  .case-jour.aujourd-hui {
    border-color: #6ea8fe;
    background: #24303d;
  }
  .case-jour.jour-passe { opacity: 0.65; }
  .case-entete-jour {
    overflow: hidden;
    font-size: 0.95vw;
    color: #8b98a3;
    line-height: 1.15;
    margin-bottom: 0.22vw;
  }
  .numero-jour {
    float: left;
    font-weight: 700;
    color: #f4f6f8;
  }
  .case-jour.aujourd-hui .numero-jour {
    background: #6ea8fe;
    color: #101418;
    padding: 0.06vw 0.34vw;
    border-radius: 0.28vw;
  }
  .mois-court {
    float: right;
    font-size: 0.8vw;
    color: #8b98a3;
    text-transform: capitalize;
  }
  .case-evenements {
    height: 80%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* Retour à la ligne automatique pour afficher le détail des RDV en entier */
  .event-puce {
    font-size: 0.82vw;
    line-height: 1.22;
    padding: 0.18vw 0.32vw;
    border-radius: 0.28vw;
    border-left: 0.24vw solid transparent;
    white-space: normal;
    word-wrap: break-word;
    margin-bottom: 0.18vw;
  }
  .event-puce.capucine {
    background: rgba(255, 105, 180, 0.18);
    border-left-color: #ff69b4;
    color: #ffd1e8;
  }
  .event-puce.clemence {
    background: rgba(255, 212, 59, 0.18);
    border-left-color: #ffd43b;
    color: #fff0b3;
  }
  .event-heure { font-weight: 700; margin-right: 0.22vw; }
  .cal-erreur {
    color: #ff8a80;
    font-size: 0.85vw;
    background: rgba(229, 83, 61, 0.14);
    border: 1px solid rgba(229, 83, 61, 0.4);
    padding: 0.35vw 0.6vw;
    border-radius: 0.4vw;
    line-height: 1.25;
  }
</style>
</head>
<body>

  <div id="colonne-gauche">
    <div>
      <div id="horloge">--:--</div>
      <div id="date"></div>
      <div id="meteo">
        <div id="meteo-ligne-principale">
          <div id="meteo-icone"></div>
          <div id="meteo-temp"></div>
        </div>
        <div id="meteo-desc"></div>
        <div id="meteo-details"></div>
        <div id="erreur-meteo">M&eacute;t&eacute;o indisponible</div>
      </div>
      <div id="meteo-horaire"></div>
      <div id="previsions-7j"></div>
    </div>
  </div>

  <div id="colonne-droite">
    <div id="pile">
      <div class="cal-bloc-unique">
        <div class="cal-entete">
          <div class="cal-titre-principal">Planning &mdash; 3 semaines</div>
          <div class="legende">
            <div class="legende-item">
              <span class="pastille pastille-capucine"></span>
              <span id="legende-capucine">Capucine</span>
            </div>
            <div class="legende-item">
              <span class="pastille pastille-clemence"></span>
              <span id="legende-clemence">Cl&eacute;mence</span>
            </div>
          </div>
        </div>

        <div class="jours-semaine-entete">
          <div class="jour-semaine-label">Lun</div>
          <div class="jour-semaine-label">Mar</div>
          <div class="jour-semaine-label">Mer</div>
          <div class="jour-semaine-label">Jeu</div>
          <div class="jour-semaine-label">Ven</div>
          <div class="jour-semaine-label">Sam</div>
          <div class="jour-semaine-label">Dim</div>
        </div>

        <div id="statut-calendrier"></div>

        <div id="zone-grille">
          <div id="grille-4-semaines"></div>
        </div>
      </div>
    </div>
  </div>

function extraireHote(url) {
  var m = String(url || "").match(/^https?:\/\/([^\/?#]+)/i);
  return m ? m[1] : url;
}

function requeteTexte(url, callback) {
  var hote = extraireHote(url);
  try {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4) {
        if (xhr.status >= 200 && xhr.status < 300) {
          callback(null, xhr.responseText);
        } else if (xhr.status === 0) {
          callback(new Error(hote + " : HTTP 0 (TLS/R\u00e9seau refus\u00e9)"), null);
        } else {
          callback(new Error(hote + " : HTTP " + xhr.status), null);
        }
      }
    };
    xhr.onerror = function () {
      callback(new Error(hote + " : erreur r\u00e9seau / TLS"), null);
    };
    xhr.send();
  } catch (err) {
    callback(new Error(hote + " : " + (err && err.message ? err.message : "exception")), null);
  }
}

function deuxChiffres(n) {
  return (n < 10 ? "0" : "") + n;
}

  }
  if (code === 45 || code === 48) {
    return '<svg class="icone-svg" viewBox="0 0 64 64" fill="none"><path d="M19 32h27a9.5 9.5 0 0 0 1.3-18.9A12.5 12.5 0 0 0 22.8 11 8.5 8.5 0 0 0 19 32z" fill="#9aa7b4"/><g stroke="#cfd8e3" stroke-width="3.5" stroke-linecap="round"><line x1="14" y1="40" x2="50" y2="40"/><line x1="18" y1="48" x2="46" y2="48"/></g></svg>';
  }
  if ((code >= 51 && code <= 65) || (code >= 80 && code <= 82)) {

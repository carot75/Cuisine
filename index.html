<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tableau cuisine</title>
<style>
  :root {
    --bg: #101418;
    --fg: #f4f6f8;
    --muted: #8b98a3;
    --card: #181f26;
    --cal1: #e5533d;
    --cal2: #3d7be5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: Helvetica, Arial, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #colonne-gauche {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 38%;
    display: flex;
    flex-direction: column;
  }
  #colonne-droite {
    position: absolute;
    top: 0;
    bottom: 0;
    right: 0;
    width: 62%;
    display: flex;
    flex-direction: column;
  }
  #colonne-gauche > div { padding: 2.2vw 2vw; }
  #horloge { font-size: 7.5vw; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  #date { font-size: 1.8vw; color: var(--muted); margin-top: 0.6vw; text-transform: capitalize; }

  /* Météo actuelle */
  #meteo { margin-top: 1.6vw; }
  #meteo-ligne-principale {
    display: flex;
    align-items: center;
    gap: 1vw;
  }
  #meteo-icone .icone-svg {
    width: 3.8vw;
    height: 3.8vw;
    display: block;
  }
  #meteo-temp { font-size: 3.6vw; font-weight: 300; line-height: 1.1; }
  #meteo-desc { font-size: 1.4vw; color: var(--muted); margin-top: 0.35vw; }
  #meteo-details { font-size: 1.1vw; color: var(--muted); margin-top: 0.3vw; }
  #erreur-meteo { font-size: 1.2vw; color: #e5533d; display: none; margin-top: 0.6vw; }

  /* Prévisions sur 7 jours (format compact pour tenir sans débordement) */
  #previsions-7j {
    margin-top: 1.4vw;
    display: flex;
    flex-direction: column;
    gap: 0.42vw;
  }
  .jour-carte {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card);
    padding: 0.45vw 0.9vw;
    border-radius: 0.65vw;
    font-size: 1.1vw;
  }
  .jour-nom {
    width: 24%;
    font-weight: 600;
    text-transform: capitalize;
  }
  .jour-icone {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .jour-icone .icone-svg {
    width: 1.8vw;
    height: 1.8vw;
    display: block;
  }
  .jour-pluie {
    color: #6ea8fe;
    font-size: 1vw;
    margin-right: 0.7vw;
    white-space: nowrap;
  }
  .jour-temp {
    white-space: nowrap;
    font-weight: 600;
  }
  .jour-temp span {
    color: var(--muted);
    font-weight: 400;
  }

  /* Calendriers */
  .cal-titre { font-size: 1.6vw; font-weight: 700; padding: 1.2vw 1.5vw 0 1.5vw; display: flex; align-items: center; gap: 0.8vw; }
  .point { width: 1vw; height: 1vw; border-radius: 50%; }
  iframe { flex: 1; border: 0; width: 100%; }
  #pile { flex: 1; display: flex; flex-direction: column; padding: 0 1.5vw 1.5vw 1.5vw; }
  .cal-bloc { flex: 1; display: flex; flex-direction: column; background: var(--card); border-radius: 1vw; overflow: hidden; }
  .cal-bloc + .cal-bloc { margin-top: 1vw; }
</style>
</head>
<body>

  <div id="colonne-gauche">
    <div>
      <div id="horloge">--:--</div>
      <div id="date"></div>
      <div id="meteo">
        <div id="meteo-ligne-principale">
          <div id="meteo-icone"></div>
          <div id="meteo-temp"></div>
        </div>
        <div id="meteo-desc"></div>
        <div id="meteo-details"></div>
        <div id="erreur-meteo">Météo indisponible</div>
      </div>
      <div id="previsions-7j"></div>
    </div>
  </div>

  <div id="colonne-droite">
    <div id="pile">
      <div class="cal-bloc">
        <div class="cal-titre"><span class="point" style="background:var(--cal1)"></span><span id="titre-cal1"></span></div>
        <iframe id="iframe-cal1"></iframe>
      </div>
      <div class="cal-bloc">
        <div class="cal-titre"><span class="point" style="background:var(--cal2)"></span><span id="titre-cal2"></span></div>
        <iframe id="iframe-cal2"></iframe>
      </div>
    </div>
  </div>

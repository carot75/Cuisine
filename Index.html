<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tableau cuisine</title>
<style>
  :root {
    --bg: #101418;
    --fg: #f4f6f8;
    --muted: #8b98a3;
    --cal1: #e5533d;
    --cal2: #3d7be5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: Helvetica, Arial, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #colonne-gauche { position: absolute; top: 0; bottom: 0; left: 0; width: 38%; display: flex; flex-direction: column; }
  #colonne-droite { position: absolute; top: 0; bottom: 0; right: 0; width: 62%; display: flex; flex-direction: column; }
  #horloge { font-size: 9vw; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  #date { font-size: 2.2vw; color: var(--muted); margin-top: 1vw; text-transform: capitalize; }
  #meteo { margin-top: 3vw; }
  #meteo-temp { font-size: 4.5vw; font-weight: 300; }
  #meteo-desc { font-size: 1.8vw; color: var(--muted); margin-top: 0.5vw; }
  #meteo-details { font-size: 1.4vw; color: var(--muted); margin-top: 0.5vw; }
  #erreur-meteo { font-size: 1.4vw; color: #e5533d; display: none; margin-top: 1vw; }
  #colonne-gauche > div { padding: 3vw 2vw; }
  .cal-titre { font-size: 1.6vw; font-weight: 700; padding: 1.2vw 1.5vw 0 1.5vw; display: flex; align-items: center; gap: 0.8vw; }
  .point { width: 1vw; height: 1vw; border-radius: 50%; }
  iframe { flex: 1; border: 0; width: 100%; }
  #pile { flex: 1; display: flex; flex-direction: column; padding: 0 1.5vw 1.5vw 1.5vw; }
  .cal-bloc { flex: 1; display: flex; flex-direction: column; background: #181f26; border-radius: 1vw; overflow: hidden; }
  .cal-bloc + .cal-bloc { margin-top: 1vw; }
</style>
</head>
<body>

  <div id="colonne-gauche">
    <div>
      <div id="horloge">--:--</div>
      <div id="date"></div>
      <div id="meteo">
        <div id="meteo-temp"></div>
        <div id="meteo-desc"></div>
        <div id="meteo-details"></div>
        <div id="erreur-meteo">Météo indisponible</div>
      </div>
    </div>
  </div>

  <div id="colonne-droite">
    <div id="pile">
      <div class="cal-bloc">
        <div class="cal-titre"><span class="point" style="background:var(--cal1)"></span><span id="titre-cal1"></span></div>
        <iframe id="iframe-cal1"></iframe>
      </div>
      <div class="cal-bloc">
        <div class="cal-titre"><span class="point" style="background:var(--cal2)"></span><span id="titre-cal2"></span></div>
        <iframe id="iframe-cal2"></iframe>
      </div>
    </div>
  </div>

<script>
/* ============================================================
   CONFIGURATION : modifie uniquement cette section.
   1. Coordonnées GPS et nom de la ville pour la météo.
   (sur https://www.coordonnees-gps.fr, cherche ta ville)
   2. Les URL widget de tes deux calendriers iCloud (voir étapes ci-après).
   ============================================================ */
const CONFIG = {
  latitude: 48.8566,
  longitude: 2.3522,
  ville: "Paris",
  titreCal1: "Famille",
  titreCal2: "Travail",
  // Sur www.icloud.com > Calendrier, clic sur le calendrier partagé >
  // "Calendrier public" > copie le lien webcal://... puis remplace
  // "webcal" par "https". Colle l'URL à la fin, après "url=" :
  urlCal1: "https://calendarplaceholder.com/generate?url=COLLE_ICI_LE_CALENDRIER_1",
  urlCal2: "https://calendarplaceholder.com/generate?url=COLLE_ICI_LE_CALENDRIER_2"
};
/* ================= FIN DE LA CONFIGURATION ================= */

// Horloge et date
function majHorloge() {
  const maintenant = new Date();
  document.getElementById("horloge").textContent =
    String(maintenant.getHours()).padStart(2, "0") + ":" +
    String(maintenant.getMinutes()).padStart(2, "0");
  document.getElementById("date").textContent =
    maintenant.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}
setInterval(majHorloge, 5000);
majHorloge();

// Météo : API Open-Meteo, gratuite et sans clé
async function majMeteo() {
  try {
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + CONFIG.latitude +
      "&longitude=" + CONFIG.longitude +
      "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m" +
      "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
      "&timezone=Europe%2FParis";
    const reponse = await fetch(url);
    const donnees = await reponse.json();

    const descriptions = {
      0: "Ciel dégagé", 1: "Peu nuageux", 2: "Partiellement nuageux", 3: "Couvert",
      45: "Brouillard", 48: "Brouillard givrant", 51: "Bruine légère", 53: "Bruine",
      55: "Bruine forte", 61: "Pluie faible", 63: "Pluie", 65: "Pluie forte",
      71: "Neige faible", 73: "Neige", 75: "Neige forte", 80: "Averses",
      81: "Averses fortes", 82: "Très fortes averses", 95: "Orage", 96: "Orage grêle", 99: "Orage forte grêle"
    };    document.getElementById("meteo-temp").textContent =
      Math.round(donnees.current.temperature_2m) + " °C";
    document.getElementById("meteo-desc").textContent =
      CONFIG.ville + " ; " + (descriptions[donnees.current.weather_code] || "Météo inconnue");
    document.getElementById("meteo-details").textContent =
      "Min " + Math.round(donnees.daily.temperature_2m_min[0]) + "° / Max " +
      Math.round(donnees.daily.temperature_2m_max[0]) + "° ; pluie " +
      donnees.daily.precipitation_probability_max[0] + " % ; vent " +
      Math.round(donnees.current.wind_speed_10m) + " km/h";
    document.getElementById("erreur-meteo").style.display = "none";
  } catch (e) {
    document.getElementById("erreur-meteo").style.display = "block";
  }
}
majMeteo();
setInterval(majMeteo, 10 * 60 * 1000); // toutes les 10 minutes

// Calendriers
document.getElementById("titre-cal1").textContent = CONFIG.titreCal1;
document.getElementById("titre-cal2").textContent = CONFIG.titreCal2;
document.getElementById("iframe-cal1").src = CONFIG.urlCal1;
document.getElementById("iframe-cal2").src = CONFIG.urlCal2;

// Rafraîchissement complet toutes les 3 heures (garde Safari propre)
setTimeout(function () { location.reload(); }, 3 * 60 * 60 * 1000);
</script>
</body>
</html>
